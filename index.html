<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0772bc">
<title>Employment Application – Lester Glenn Honda of Sea Girt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0772bc; --brand-deep:#054f84; --ink:#1c2b39; --muted:#5b6b7a;
  --paper:#ffffff; --mist:#eaf2f9; --line:#c9d9e8; --warn:#b93b0c; --ok:#1f7a45;
  --head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
header.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.bar-in{max-width:640px;margin:0 auto}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandrow img{height:30px;width:auto}
.stepcount{font-size:14px;color:var(--muted);white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:12px}
.startover{font:inherit;font-size:14px;font-weight:700;color:var(--brand);background:#fff;border:1.5px solid var(--brand);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer;white-space:nowrap}
.startover:hover{background:var(--brand);color:#fff}
.startover:focus-visible{outline:3px solid var(--brand-deep);outline-offset:2px}
@media (max-width:420px){.hdr-right{gap:8px}.modelink{display:none}}
.clearbtn{font:inherit;font-size:14px;font-weight:700;color:var(--warn);background:#fff4ee;border:1.5px dashed var(--warn);border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
.progress{height:5px;background:var(--mist);margin:10px -16px 0;}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s ease}
main{max-width:640px;margin:0 auto;padding:18px 16px 120px}
.intro{text-align:center;padding:6px 0 4px}
.intro img{height:52px;width:auto}
.intro .co{font-family:var(--head);font-weight:700;font-size:26px;color:var(--brand);margin:6px 0 0;line-height:1.1}
.intro .dba{font-family:var(--head);font-weight:600;font-size:18px;color:var(--brand-deep);margin:2px 0 0}
.intro .t{font-weight:700;margin:10px 0 0}
.eeo{font-size:14px;color:var(--muted);margin:10px 0 0}
h2{font-family:var(--head);font-weight:700;font-size:28px;line-height:1.1;margin:8px 0 4px;color:var(--ink)}
.lede{color:var(--muted);margin:0 0 14px;font-size:15.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h3{font-family:var(--head);font-weight:700;font-size:20px;margin:0 0 10px;color:var(--brand-deep)}
.f{margin:0 0 16px}
.f:last-child{margin-bottom:0}
label.l,.q{display:block;font-weight:600;margin:0 0 6px}
.q{font-weight:600}
.opt{font-weight:400;color:var(--muted);font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],textarea{
  width:100%;font:inherit;font-size:17px;color:var(--ink);background:#fbfdff;border:1.5px solid var(--line);
  border-radius:8px;padding:12px 12px;min-height:48px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:48px}
textarea{min-height:96px;resize:vertical}
select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#fbfdff;border:1.5px solid var(--line);border-radius:8px;padding:12px 40px 12px 12px;min-height:48px;-webkit-appearance:none;appearance:none}
select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(7,114,188,.18)}
select:invalid,select option[value=""]{color:var(--muted)}
.selwrap{position:relative}
.selwrap::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.bad select{border-color:var(--warn)!important}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(7,114,188,.18)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:10px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
.seg{display:flex;gap:10px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--line);border-radius:8px;background:#fbfdff;font-weight:600;cursor:pointer;user-select:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--brand-deep);outline-offset:4px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fbfdff;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.checks label:has(input:checked){border-color:var(--brand);background:#f1f7fc}
.follow{border-left:3px solid var(--brand);padding:2px 0 2px 12px;margin:12px 0 0}
.hidden{display:none!important}
.statement{border-top:1px solid var(--line);padding:14px 0 0;margin:14px 0 0}
.statement:first-of-type{border-top:0;padding-top:0;margin-top:0}
.statement p{margin:0 0 8px;font-size:15.5px}
.statement .n{font-family:var(--head);font-weight:700;color:var(--brand);margin-right:6px}
.initials{display:flex;align-items:center;gap:10px}
.initials input{max-width:110px;text-transform:uppercase;text-align:center;letter-spacing:.08em}
.legal p{font-size:15.5px;margin:0 0 10px}
.sig{position:relative;border:1.5px dashed var(--brand);border-radius:8px;background:#fff;height:150px;touch-action:none}
.sig canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:8px}
.sig .ph{position:absolute;left:14px;right:14px;bottom:34px;border-bottom:1.5px solid var(--ink);pointer-events:none}
.sig .x{position:absolute;left:14px;bottom:40px;font-weight:700;font-size:22px;pointer-events:none}
.sig .tip{position:absolute;right:12px;top:8px;font-size:13px;color:var(--muted);pointer-events:none}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}
.photo{display:block;border:1.5px dashed var(--brand);border-radius:10px;background:#f3f7fb;cursor:pointer;overflow:hidden;position:relative;aspect-ratio:3.375/2.125}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.photo .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px}
.photo .empty b{font-size:17px}
.photo .empty span{font-size:14px;color:var(--muted)}
.photo img.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.photo.has .empty{display:none}
.cam{width:46px;height:36px}
.company{font-size:15px;margin:0}
.company div{margin:2px 0}
nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10}
.foot-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:10px;font:inherit;font-weight:700;font-size:17px;border:1.5px solid var(--brand);background:var(--paper);color:var(--brand);cursor:pointer}
.btn.primary{background:var(--brand);color:#fff}
.btn.skip{flex:.7;border-style:dashed;border-color:var(--warn);color:var(--warn)}
.testbadge{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--warn);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;z-index:11}
.btn:disabled{opacity:.45}
.mgrbox{border:3px solid #e01b1b;border-radius:4px;background:#fff;padding:12px 14px;margin:0 0 12px;text-align:center}
.mgrbox .lbl{display:block;font-size:14px;font-weight:600;color:#1c2b39;margin:0 0 4px}
.mgrbox .addr{display:block;font-size:clamp(15px,4.6vw,19px);font-weight:700;color:#000;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.mgrbox .tip{display:block;font-size:13px;color:#5b6b7a;margin:6px 0 0}
.mgraddr{display:block;width:100%;font:inherit;font-size:16px;text-align:center;border:1.5px dashed #e01b1b;border-radius:8px;padding:10px;margin:0 0 10px;background:#fff6f6;color:#7a0b0b}
.btn:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--brand-deep);outline-offset:2px}
.err{color:var(--warn);font-size:14.5px;font-weight:600;margin:6px 0 0}
.bad input,.bad textarea,.bad .seg label,.bad .sig,.bad.photo,.bad .photo{border-color:var(--warn)!important}
.alert{background:#fff4ee;border:1.5px solid #f2c3ad;color:#7a2a08;border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:15.5px}
.done{background:#eef8f2;border:1.5px solid #b9dfc8;border-radius:10px;padding:14px;margin:0 0 14px}
.sum dl{margin:0}
.sum dt{font-size:13.5px;color:var(--muted);margin-top:8px}
.sum dd{margin:0;font-weight:600;word-break:break-word}
.sum .edit{float:right}
.sendbox .btn{width:100%;margin:0 0 10px;display:block}
.small{font-size:14px;color:var(--muted)}
/* ---------- landing page ---------- */
.landing{text-align:center;padding:10px 0 0}
.landing .biglogo{width:min(260px,70%);height:auto;margin:6px auto 4px;display:block}
.landing h1{font-family:var(--head);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.12;color:var(--brand-deep);margin:14px 0 6px}
.landing h1 span{display:block;font-size:.62em;font-weight:600;color:var(--brand)}
.landing .mission{max-width:720px;margin:18px auto 6px;padding:18px 26px 20px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;text-align:left}
.landing .mission b{display:block;font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.landing .mission p{margin:0;font-family:var(--body);font-size:18px;line-height:1.7;font-style:italic;font-weight:700;color:var(--ink)}
.landing .team{max-width:760px;margin:34px auto 10px;padding-top:22px;border-top:1px solid rgba(7,114,188,.2)}
.landing .team h2{font-family:var(--head);font-weight:700;font-size:22px;color:var(--brand-deep);margin:0 0 16px}
.landing .team-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.landing .member{margin:0;text-align:center;flex:0 0 calc((100% - 36px)/3)}
.landing .member img{width:100%;max-width:150px;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.landing .member b{display:block;font-family:var(--head);font-size:15px;margin-top:8px;color:var(--brand-deep)}
.landing .member span{display:block;font-size:13px;line-height:1.3;margin-top:2px;opacity:.8}
@media (max-width:420px){.landing .team-grid{gap:14px}.landing .member{flex-basis:calc((100% - 14px)/2)}}
.landing .pick{font-size:17px;margin:18px auto 14px;max-width:460px}
.devices{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto}
@media (max-width:360px){.devices{grid-template-columns:1fr}}
.device{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;padding:18px 10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease}
.device svg{width:64px;height:64px}
.device b{font-family:var(--head);font-size:24px;font-weight:700;color:var(--brand-deep)}
.device span{font-size:14px;color:var(--muted)}
.devices.stores{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-width:560px}
.stores .device b{font-size:21px;line-height:1.2}
.device:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(7,114,188,.15);transform:translateY(-2px)}
.device:focus-visible{outline:3px solid var(--brand-deep);outline-offset:3px}
.modelink{background:none;border:0;font:inherit;font-size:13px;color:var(--brand);font-weight:600;cursor:pointer;padding:4px 0;white-space:nowrap}
body.landing-on nav.foot{display:none}
body.landing-on main{padding-bottom:40px}

/* ---------- PC version: wider page, fields side by side ---------- */
body.pc{font-size:16px}
body.pc .bar-in, body.pc main, body.pc .foot-in{max-width:980px}
body.pc main{padding:26px 24px 120px}
body.pc h2{font-size:32px}
body.pc .card{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;column-gap:24px;align-content:start}
body.pc .card > *{grid-column:1 / -1}
body.pc .card > .f:not(:has(textarea, .seg, .checks, .sig, .follow, .initials, .legal, .company, .mgrbox)){grid-column:auto}
body.pc .card > .f{margin-bottom:18px}
body.pc .card > .f[data-wrap=street],body.pc .card > .f[data-wrap=position]{grid-column:1 / -1}
body.pc input[type=text],body.pc input[type=email],body.pc input[type=tel],body.pc input[type=date],body.pc select,body.pc textarea{font-size:16px;min-height:42px;padding:9px 12px}
body.pc .seg{max-width:320px}
body.pc .seg label{min-height:42px}
body.pc .checks{grid-template-columns:repeat(4,1fr)}
body.pc .checks label{min-height:42px}
body.pc .sig{height:170px;max-width:560px}
body.pc .sigbar{max-width:560px}
body.pc .row3{grid-template-columns:2fr 1fr 1fr}
body.pc .sum dl{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
body.pc .sendbox{display:block}
body.pc .sendbox .btn,body.pc .sendbox .mgrbox{max-width:520px;margin-left:auto;margin-right:auto}
body.pc .foot-in{justify-content:flex-end}
body.pc .foot-in .btn{flex:0 0 180px}
body.pc .btn{min-height:46px}
body.pc .btn:not(:disabled):hover{filter:brightness(.95)}

/* ---------- Cell phone version: extra-large tap targets ---------- */
body.phone input[type=text],body.phone input[type=email],body.phone input[type=tel],body.phone input[type=date],body.phone select,body.phone textarea{min-height:52px;font-size:17px}
body.phone .seg label,body.phone .checks label{min-height:52px}
body.phone .btn{min-height:56px}
body.phone .card{padding:16px 14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============ SETTINGS ============
   HR_EMAIL: where applicants should send the finished PDF (shown on the last screen).
   Leave '' to show no address.                                                     */
const HR_EMAIL = '';
/* FORD_EMAIL_ROUTES: Lester Glenn Ford of Ocean only. When that store is picked, these are the
   ONLY routes used (no fallback to the Chevy addresses). Positions not listed get HR_EMAIL.

const FORD_STORE = 'Lester Glenn Ford of Ocean';
const FORD_EMAIL_ROUTES = [
  {to:'Apps.fdocsm.storemanagers@lesterglenn.com', positions:['General Manager of Store','Service Director']},
  {to:'Apps.fdoc.Salesbdc@lesterglenn.com', positions:['Sales BDC','Sales BDC Manager']},
  {to:'Apps.fdoc.sales@lesterglenn.com', positions:['Swap Driver']},
  {to:'Apps.fdoc.finance@lesterglenn.com', positions:['Finance Manager']},
  {to:'apps.fdoclottr.service@lesterglenn.com', positions:['Lot Attendant']},
  {to:'Apps.fdoc.Service@lesterglenn.com', positions:['Service Writer','Express Service Writer','Valet','A Tech','B Tech','C Tech','Lube Tech','PDI Tech','Tech Apprentice']},
  {to:'apps.k35RecCas@lesterglenn.com', positions:['Receptionist','Cashier']}
];
const isFord = () => data.store === FORD_STORE;
const EMAIL_ROUTES = [   // Lester Glenn Chevy of Freehold ONLY these addresses; positions not listed get HR_EMAIL
  {to:'Apps.cvfcsm.storemanagers@lesterglenn.com', positions:['General Manager of Store','Service Director']},
  {to:'Apps.cvfc.Salesbdc@lesterglenn.com', positions:['Sales BDC','Sales BDC Manager']},
  {to:'Apps.cvfc.sales@lesterglenn.com', positions:['Swap Driver']},
  {to:'Apps.cvfc.finance@lesterglenn.com', positions:['Finance Manager']},
  {to:'Apps.cvfclottr.service@lesterglenn.com', positions:['Lot Attendant']},
  {to:'Apps.cvfc.Service@lesterglenn.com', positions:['Service Writer','Express Service Writer','Valet','A Tech','B Tech','C Tech','Lube Tech','PDI Tech','Tech Apprentice']},
  {to:'apps.k35RecCas@lesterglenn.com', positions:['Receptionist','Cashier']}
];
/* FLOW_URL: the "HTTP URL" copied from your Power Automate flow trigger.

const FLOW_URL = '';
/* TEST_MODE: true shows a "Skip" button that moves to the next page without checking

const T = {"eeo": "We consider all applicants without regard to race, color, creed, religion, sex, ancestry, national origin, age, marital or veteran status, or the presence of a non job-related medical condition, handicap or disability, or any other legally protected status.", "essential": "The essential functions and requirements of the job will be explained to you during the interview process. If there is anything that would prevent you from performing in a reasonable and safe manner each essential job function and requirement of the job for which you are applying, please indicate below.", "idq": "If employment is offered, can you submit two of the following: Birth Certificate, Social Security Card, Certificate of US Citizenship, US Passport, State issued Driver’s License, or other verification of your identity and authorization to work in the United States?", "emp_intro": "In the following space, give a complete record of your employment and explain any periods of unemployment. Begin with your most recent employment and work back. If additional space is needed, please attach a supplementary sheet.", "skills": "Please indicate any other information you think would be helpful to us in considering you for employment, such as additional work experience, skills, abilities, articles/books published, activities, foreign languages, accomplishments, professional/ trade/business/ or civic activities and offices held, etc. (You may exclude information indicative of age, sex, race, religion, color, national origin, handicap, or disability or any relationship with any labor organization).", "addl_intro": "(In responding to these inquiries, continue on a separate sheet of paper if you require additional space)", "nameq": "In order to permit a check of your work and education records, should we be made aware of any change of name or assumed name that you previously used?", "termq": "Have you ever been terminated or asked to resign from any employment?", "statements": ["I authorize the Employer to investigate all statements in this application and to secure and necessary information from all my employers, references, and academic institutions. I hereby release all of those employers, references, academic institutions, and the Employer from any and all liability arising from their giving or receiving information about my employment history, my academic credentials or qualifications, and my suitability for employment with the Lester Glenn Auto Group.", "I also authorize the Employer to secure criminal (when the hiring process is completed), financial and credit information through an appropriate agency, and I understand that, upon my written request made within a reasonable period of time, the agency providing a consumer report to the Employer will provide me with a complete description of the nature of the scope of the credit report investigation.", "I understand that any offer of employment is contingent upon receipt of a satisfactory report concerning my credit, academic credentials, and employment references.", "I authorize the Employer to supply information about my employment record, in whole or in part, in confidence to any prospective employer, government agency, or other party having a legal and proper interest, and I hereby release the Employer from any and all liability for its providing this information.", "In the event of employment or an offer of employment, I authorize any physician or hospital to release any information which may be necessary to determine my ability to perform the essential functions of the job for which I am hired or being considered or any future job.", "I hereby agree to submit to any lawful drug, alcohol or other testing that may be required as a condition of my employment or continued employment and understand that refusal to submit to such testing during the course of my employment may result in disciplinary action up to and including discharge.", "I understand that according to federal law all individuals who are hired must, as a condition of their employment, procure certain documentation to verify their identity and U.S. citizenship status or, if aliens, their legal authorization to work in the U.S. As a consequence, I understand that any offer of employment would be contingent on my ability to produce the required documentation within the time period required by law.", "I agree and understand that any offer of employment that I may receive is contingent upon my successful completion of the Lester Glenn Auto Group’s pre employment, post offer, screening process including any pre-employment, post offer, physical examination that may be required.", "In the event of my employment with the Lester Glenn Auto Group, I will comply with all rules, regulations, and policies of the Lester Glenn Auto Group.", "I understand that nothing in this employment application, the Lester Glenn Auto Group’s policy statements, personnel guidelines, or in my communications with any Employer official is intended to create an employment contract between the Employer and myself. I also understand that the Employer has the right to modify its policies without giving me any notices of the changes. No promises regarding employment have been made to me, and I understand that no such promise or guarantee is binding upon the Employer unless it is made in writing and signed by the President. I understand that if an employment relationship is established, I have the right to terminate my employment at any time for any reason I think appropriate. I also understand that the Employer retains the right to terminate my employment at any time for any reason Employer believes is appropriate.", "I certify that all of the information I have provided on this application for employment is true and complete. I further understand that any false or misleading statements will be sufficient cause for rejection of my application if the Employer has not employed me and for immediate dismissal if the Employer has employed me.", "I certify that, should the Employer offer employment, I will not engage in any “moonlighting” or employment outside of the Employer without the approval of management.", "I understand that as a condition of any offer of employment and/or continued employment with the Lester Glenn Auto Group, all persons applying or having positions which require operation of a dealership vehicle are subject to a pre-employment and post offer driver record screening process."], "ack": "I hereby acknowledge that I have read, understand and agree to the preceding 13 statements.", "drug": ["Be advised that Employer has adopted a Drug-Free Workplace Program that subjects its job applicants who have been made a tentative job offer to Drug Screening as a condition of hiring.", "Employer requires its job applicants who have received a conditional offer of employment to submit to a drug screening as a final part of their job application process. Any application for employment, offer of employment, and/or any initial employment already begun are conditioned on the applicant passing the screening.", "Employer will not hire and/or will revoke any offer of employment or initial employment already begun, of any applicant who fails to pass his/her screening and/or whose drug screening is confirmed positive.", "Also while applicants voluntarily may refuse to submit to such screening, Employer will not hire and/or revoke any employment offer or initial employment already begun, of any applicant who refuses to consent to screening or otherwise refuses to cooperate with all pre-employment drug screening procedures or requirements.", "Employer strongly encourages individuals who have a drug or alcohol related problem to voluntarily seek confidential assistance."], "bg": "I acknowledge receipt of the separate document entitled DISCLOSURE REGARDING BACKGROUND INVESTIGATION and A SUMMARY OF YOUR RIGHTS UNDER THE FAIR CREDIT REPORTING ACT and certify that I have read and understand both of those documents. I hereby authorize the obtaining of “consumer reports” and/or “investigative consumer reports” by the Employer at any time after receipt of this authorization and throughout my employment, or status as an Advisor, if applicable. To this end, I hereby authorize, without reservation, any law enforcement agency, administrator, state or federal agency, institution, school or university (public or private), information service bureau, employer, or insurance company to furnish any and all background information requested by TR Information Services P.O. Box 780254, Orlando, FL 32878; 800-894-9141; www.fullsearch.com , www.drivingrecord.net and/or from Employer itself. I agree that a facsimile (“fax”), electronic or photographic copy of this Authorization shall be as valid as the original."};

/* ---------- locations ---------- */
const LOC_MAIN = 'Lester Glenn Chevy of Freehold';
const LOC_BDC = 'Lester Glenn Service BDC of Toms River';
const BDC_ROLES = ['Service BDC Receptionist','Service BDC Rep'];
function isServiceBDC(){ return data.position === 'Service' && BDC_ROLES.includes(data.service_position); }
function locationOptions(){ return isServiceBDC() ? [...STORES, LOC_BDC] : [...STORES]; }
let wasBDC = false;
function syncLocation(){
  const bdc = isServiceBDC();
  if (bdc && !wasBDC) data.location = LOC_BDC;                 // just picked a BDC role: default to Toms River
  if (!bdc && data.location === LOC_BDC) data.location = data.store || '';   // no longer BDC: back to the store they picked
  wasBDC = bdc;
  const sel = document.getElementById('location');
  if (sel){
    sel.innerHTML = `<option value="" disabled ${data.location ? '' : 'selected'}>Choose a location</option>` +
      locationOptions().map(o => `<option value="${esc(o)}" ${data.location === o ? 'selected' : ''}>${esc(o)}</option>`).join('');
    if (data.location){ const w = sel.closest('[data-wrap]'); w?.classList.remove('bad'); w?.querySelector('.err')?.remove(); }
  }
  document.getElementById('bdc_note')?.classList.toggle('hidden', !bdc);
  saveDraft();
}

function landingHTML(){
  return `<section class="landing">
    <img class="biglogo" src="${LOGO}" alt="Lester Glenn Auto Group">
    <h1>Kraushaar 35 Inc.<span>(Lester Glenn Auto Group) Job Application</span></h1>
    <div class="mission"><b>Our Mission</b><p>We believe in providing an unparalleled, exceptional, full-service, retail automotive experience with complete transparency, at competitive prices, by committed and passionate employees whose number one goal is the customer’s complete satisfaction.</p></div>
    ${flash ? `<div style="text-align:left;max-width:560px;margin:14px auto 0">${flash}</div>` : ''}
    <p class="pick">Please click on <b>PC</b> if using a PC or <b>Cell Phone</b> if applying using a Cell Phone.</p>
    <div class="devices">
      <button type="button" class="device" data-mode="pc">${MONITOR}<b>PC</b><span>Desktop or laptop computer</span></button>
      <button type="button" class="device" data-mode="phone">${PHONE}<b>Cell Phone</b><span>iPhone or Android</span></button>
    </div>
    <div class="team"><h2>Meet Our Leadership Team</h2><div class="team-grid">${TEAM.map(p => `<figure class="member"><img src="${p.img}" alt="${esc(p.n)}" loading="lazy"><figcaption><b>${esc(p.n)}</b><span>${esc(p.t)}</span></figcaption></figure>`).join('')}</div></div>
  </section>`;
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-mode]');
  if (d){
    // fresh start: wipe any answers, signatures and saved progress before opening the application
    for (const k in data) delete data[k];
    clearDraft(); submitted = false; wasBDC = false;
    mode = d.dataset.mode; step = 0; saveDraft(); render(); return;
  }
  const st = e.target.closest('[data-store]');
  if (st){
    data.store = st.dataset.store;
    if (!data.location || data.location === LOC_MAIN || STORES.includes(data.location)) data.location = data.store;  // preselect Preferred Location
    step = 0; saveDraft(); render(); return;
  }
  if (e.target.closest('#storeback')){ mode = ''; saveDraft(); render(); return; }
  if (e.target.closest('#switchmode')){ mode = mode === 'pc' ? 'phone' : 'pc'; saveDraft(); render(); }
});

/* ---------- state ---------- */
const data = {};
const DRAFT_KEY = 'lg_obc_application_draft_v1';
function saveDraft(){
  try{
    const keep = {};
    for (const k in data) if (!/^(sig\d|dl_front|dl_back)$/.test(k)) keep[k] = data[k];
    localStorage.setItem(DRAFT_KEY, JSON.stringify({step, mode, data:keep}));
  }catch(e){}
}
function loadDraft(){
  try{ const s = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (s && s.data){ Object.assign(data, s.data); mode = s.mode || ''; return s.step || 0; } }catch(e){}
  return 0;
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtDate = v => { if (!v) return ''; const [y,m,d] = v.split('-'); return `${m}/${d}/${y}`; };
function fmtPhone(v){
  let d = String(v).replace(/\D/g,''); if (d.length === 11 && d[0] === '1') d = d.slice(1); d = d.slice(0,10);
  if (d.length < 4) return d.length ? '(' + d : '';
  if (d.length < 7) return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
}

/* ---------- rendering ---------- */
let step = 0;
const optTag = it => it.opt && !it.quiet ? ' <span class="opt">(optional)</span>' : '';

function inputHTML(it){
  const v = esc(data[it.id] ?? '');
  const base = `id="${it.id}" name="${it.id}" data-id="${it.id}"`;
  switch (it.type){
    case 'text': return `<input type="text" ${base} value="${v}" ${it.inputmode ? `inputmode="${it.inputmode}"` : ''} autocomplete="${auto(it.id)}">`;
    case 'email': return `<input type="email" ${base} value="${v}" inputmode="email" autocomplete="email">`;
    case 'tel': return `<input type="tel" ${base} value="${v}" inputmode="tel" placeholder="(732) 555-5555" autocomplete="${it.id === 'phone_cell' ? 'tel' : 'off'}">`;
    case 'zip': return `<input type="text" ${base} value="${v}" inputmode="numeric" maxlength="5" autocomplete="postal-code">`;
    case 'date': return `<input type="date" ${base} value="${v}">`;
    case 'area': return `<textarea ${base} rows="3">${v}</textarea>`;
    case 'select': return `<div class="selwrap"><select ${base}><option value="" ${v ? '' : 'selected'} disabled>${esc(it.placeholder || 'Choose one')}</option>${(it.optionsFn ? it.optionsFn() : it.options).map(o => `<option value="${esc(o)}" ${data[it.id] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>${it.id === 'location' ? `<div class="hint ${isServiceBDC() ? '' : 'hidden'}" id="bdc_note" style="margin:6px 0 0">Service BDC positions are based at our Toms River location.</div>` : ''}`;
  }
  return '';
}
function auto(id){ return {first:'given-name', last:'family-name', middle:'additional-name', street:'street-address', city:'address-level2', state:'address-level1'}[id] || 'off'; }

function itemHTML(it){
  if (it.row || it.row3){
    const cls = it.row ? 'row' : 'row3';
    return `<div class="${cls}">${(it.row || it.row3).map(itemHTML).join('')}</div>`;
  }
  if (it.type === 'info') return `<div class="legal">${it.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
  if (it.type === 'company') return `<div class="company"><div><b>Company:</b> Kraushaar 35 Inc., DBA Lester Glenn Honda of Sea Girt</div><div><b>Contact:</b> Antonio Martire, Jr.</div><div><b>Phone:</b> 732-349-4200 Ext. 18559 &nbsp; <b>Fax:</b> 732-929-0780</div><div><b>Email:</b> tmartire@lesterglenn.com</div></div>`;
  const hint = it.hint ? `<div class="hint">${esc(it.hint)}</div>` : '';
  let inner = '';
  if (it.type === 'yesno'){
    inner = `<div class="q" id="${it.id}_q">${esc(it.label)}${optTag(it)}</div>
      <div class="seg" role="radiogroup" aria-labelledby="${it.id}_q">
        ${['Yes','No'].map(o => `<label><input type="radio" name="${it.id}" data-id="${it.id}" value="${o}" ${data[it.id] === o ? 'checked' : ''}><span>${o}</span></label>`).join('')}
      </div>`;
    if (it.ifYes) inner += `<div class="follow ${data[it.id] === 'Yes' ? '' : 'hidden'}" data-follow="${it.id}" data-when="Yes">${it.ifYes.map(itemHTML).join('')}</div>`;
    if (it.ifNo) inner += `<div class="follow ${data[it.id] === 'No' ? '' : 'hidden'}" data-follow="${it.id}" data-when="No">${it.ifNo.map(itemHTML).join('')}</div>`;
  } else if (it.type === 'checks'){
    const cur = data[it.id] || [];
    inner = `<div class="q">${esc(it.label)}${optTag(it)}</div><div class="checks" ${it.one ? 'style="grid-template-columns:1fr"' : ''}>
      ${it.options.map(o => `<label><input type="checkbox" data-id="${it.id}" value="${esc(o)}" ${cur.includes(o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>`;
    if (it.ifChecked) inner += `<div class="follow ${cur.includes(it.ifChecked.option) ? '' : 'hidden'}" data-follow="${it.id}" data-when-check="${esc(it.ifChecked.option)}">${it.ifChecked.items.map(itemHTML).join('')}</div>`;
  } else if (it.type === 'initials'){
    return `<div class="statement f" data-wrap="${it.id}"><p><span class="n">${it.n}.</span>${esc(it.label)}</p>
      <div class="initials"><label class="l" for="${it.id}" style="margin:0">Initials</label><input type="text" id="${it.id}" data-id="${it.id}" value="${esc(data[it.id] || '')}" maxlength="4" autocapitalize="characters" autocomplete="off"></div></div>`;
  } else if (it.type === 'sig'){
    inner = `<div class="q">${esc(it.label)}</div>
      <div class="sig" data-sig="${it.id}"><span class="tip">Sign with your finger or mouse</span><span class="x">X</span><span class="ph"></span><canvas aria-label="${esc(it.label)} pad"></canvas></div>
      <div class="sigbar"><span>By signing, you agree this is your electronic signature.</span><button type="button" class="linkbtn" data-clear="${it.id}">Clear</button></div>`;
  } else if (it.type === 'photo'){
    const has = !!data[it.id];
    inner = `<div class="q">${esc(it.label)}</div>
      <label class="photo ${has ? 'has' : ''}" data-photo="${it.id}">
        <input type="file" accept="image/*" data-file="${it.id}" aria-label="${esc(it.label)}">
        <div class="empty">${CAM}<b>Tap to add a photo</b><span>Take a picture or choose one from your Photos</span></div>
        ${has ? `<img class="pv" alt="${esc(it.label)} photo" src="${data[it.id]}">` : ''}
      </label>
      <div class="sigbar"><span>Make sure all four corners and the text are clear.</span><button type="button" class="linkbtn ${has ? '' : 'hidden'}" data-rmphoto="${it.id}">Replace</button></div>`;
  } else {
    inner = `<label class="l" for="${it.id}">${esc(it.label)}${optTag(it)}</label>${hint}${inputHTML(it)}`;
    if (it.ifValue) inner += it.ifValue.map(v => `<div class="follow ${data[it.id] === v.value ? '' : 'hidden'}" data-follow="${it.id}" data-when-val="${esc(v.value)}">${v.items.map(itemHTML).join('')}</div>`).join('');
  }
  return `<div class="f" data-wrap="${it.id}">${inner}</div>`;
}

function render(){
  applyMode();

    $('#stepcount').textContent = '';
    $('#prog').style.width = '0%';

    return;
  }
  if (!data.store){
    $('#stepcount').textContent = '';
    $('#prog').style.width = '0%';
    $('#main').innerHTML = storeHTML();
    window.scrollTo({top:0});
    return;
  }
  const s = STEPS[step];
  $('#stepcount').textContent = `Step ${step + 1} of ${STEPS.length}`;
  $('#prog').style.width = ((step + 1) / STEPS.length * 100) + '%';
  let h = '';
  if (s.intro) h += `<div class="intro"><p class="co">Kraushaar 35 Inc.</p><p class="dba">DBA: Lester Glenn Honda of Sea Girt</p><p class="t">Application for Employment<br><span style="font-weight:400">An Equal Opportunity Employer</span></p><p class="eeo">${esc(T.eeo)}</p></div>`;
  h += `<h2>${esc(s.title)}</h2>`;
  if (s.lede) h += `<p class="lede">${esc(s.lede)}</p>`;
  h += `<div id="alert">${step === 0 && flash ? flash : ''}</div>`;
  if (step === 0) flash = '';
  if (s.review) h += reviewHTML();
  for (const c of s.cards){
    const show = !c.showIf || c.showIf(data);
    h += `<section class="card ${show ? '' : 'hidden'}" ${c.showIf ? 'data-cond="1"' : ''}>${c.card ? `<h3>${esc(c.card)}</h3>` : ''}${c.items.map(itemHTML).join('')}</section>`;
  }
  $('#main').innerHTML = h;
  // defaults
  walk(s, it => {
    if (data[it.id] === undefined && it.today){ data[it.id] = today(); const el = document.getElementById(it.id); if (el) el.value = data[it.id]; }
    if (data[it.id] === undefined && it.value){ data[it.id] = it.value; const el = document.getElementById(it.id); if (el) el.value = it.value; }
  });
  setupSigs();
  $('#back').disabled = false;   // Back on step 1 returns to the PC / Cell Phone page
  $('#skip').classList.toggle('hidden', !TEST_MODE || !!s.review);
  $('#next').textContent = step === STEPS.length - 2 ? 'Review' : 'Next';
  $('#next').classList.toggle('hidden', !!s.review);
  $('#next').classList.toggle('primary', !s.review);
  window.scrollTo({top:0});
}

function walk(s, fn){
  const go = items => items.forEach(it => {
    if (it.row || it.row3) return go(it.row || it.row3);
    if (it.id) fn(it);
    if (it.ifYes) go(it.ifYes); if (it.ifNo) go(it.ifNo);
    if (it.ifChecked) go(it.ifChecked.items);
    if (it.ifValue) it.ifValue.forEach(v => go(v.items));
  });
  s.cards.forEach(c => go(c.items));
}

/* ---------- inputs ---------- */
document.addEventListener('input', e => {
  const el = e.target, id = el.dataset.id; if (!id) return;
  if (el.type === 'tel'){ const pos = el.value.length; el.value = fmtPhone(el.value); }
  if (el.dataset.id === 'zip' || /zip/.test(id)) el.value = el.value.replace(/\D/g,'').slice(0,5);
  if (el.type === 'checkbox'){
    data[id] = [...document.querySelectorAll(`input[type=checkbox][data-id="${id}"]:checked`)].map(x => x.value);
    const f = document.querySelector(`[data-follow="${id}"][data-when-check]`);
    if (f) f.classList.toggle('hidden', !data[id].includes(f.dataset.whenCheck));
  } else if (el.type === 'radio'){
    data[id] = el.value;
    document.querySelectorAll(`[data-follow="${id}"]`).forEach(f => f.classList.toggle('hidden', f.dataset.when !== el.value));
    // conditional employer cards
    const s = STEPS[step];
    document.querySelectorAll('section.card[data-cond]').forEach((sec, i) => {
      const conds = s.cards.filter(c => c.showIf);
      sec.classList.toggle('hidden', !conds[i].showIf(data));
    });
  } else if (el.type !== 'file'){
    data[id] = el.value;
    if (id === 'position' || id === 'service_position') syncLocation();
    if (el.tagName === 'SELECT') document.querySelectorAll(`[data-follow="${id}"][data-when-val]`).forEach(f => f.classList.toggle('hidden', f.dataset.whenVal !== el.value));
  }
  const w = el.closest('[data-wrap]'); if (w){ w.classList.remove('bad'); w.querySelector('.err')?.remove(); }
  saveDraft();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'radio' || el.type === 'checkbox') el.dispatchEvent(new Event('input', {bubbles:true}));
  if (el.dataset.file) loadPhoto(el);
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-clear]');
  if (c){ const id = c.dataset.clear; delete data[id]; const pad = pads[id]; if (pad) pad.clear(); }
  const r = e.target.closest('[data-rmphoto]');
  if (r){ document.querySelector(`[data-file="${r.dataset.rmphoto}"]`).click(); }
  const ed = e.target.closest('[data-goto]');
  if (ed){ step = +ed.dataset.goto; render(); saveDraft(); }
});

function loadPhoto(input){
  const id = input.dataset.file, f = input.files && input.files[0]; if (!f) return;
  const box = document.querySelector(`[data-photo="${id}"]`);
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    data[id] = cv.toDataURL('image/jpeg', 0.82);
    URL.revokeObjectURL(url);
    let pv = box.querySelector('img.pv');
    if (!pv){ pv = document.createElement('img'); pv.className = 'pv'; pv.alt = id; box.appendChild(pv); }
    pv.src = data[id]; box.classList.add('has');
    document.querySelector(`[data-rmphoto="${id}"]`)?.classList.remove('hidden');
    const w = box.closest('[data-wrap]'); if (w){ w.classList.remove('bad'); w.querySelector('.err')?.remove(); }
  };
  img.onerror = () => { alert('That file could not be opened as a photo. Please choose a JPG or PNG photo.'); URL.revokeObjectURL(url); };
  img.src = url;
}

/* ---------- signature pads ---------- */
const pads = {};
function setupSigs(){
  document.querySelectorAll('[data-sig]').forEach(box => {
    const id = box.dataset.sig, cv = box.querySelector('canvas');
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const fit = () => { cv.width = box.clientWidth * ratio; cv.height = box.clientHeight * ratio; const cx = cv.getContext('2d'); cx.scale(ratio, ratio); cx.lineWidth = 2.4; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#0b2e57';
      if (data[id]){ const im = new Image(); im.onload = () => cx.drawImage(im, 0, 0, box.clientWidth, box.clientHeight); im.src = data[id]; } };
    fit();
    let drawing = false, last = null, inked = !!data[id];
    const pt = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
    cv.addEventListener('pointerdown', e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e), cx = cv.getContext('2d'); cx.beginPath(); cx.moveTo(last.x, last.y); cx.lineTo(p.x, p.y); cx.stroke(); last = p; inked = true; e.preventDefault(); });
    const end = () => { if (!drawing) return; drawing = false; if (inked){ data[id] = cv.toDataURL('image/png'); const w = box.closest('[data-wrap]'); if (w){ w.classList.remove('bad'); w.querySelector('.err')?.remove(); } } };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
    pads[id] = {clear(){ const cx = cv.getContext('2d'); cx.clearRect(0, 0, cv.width, cv.height); inked = false; }};
  });
}

/* ---------- validation ---------- */
function validate(){
  const s = STEPS[step], missing = [];
  document.querySelectorAll('.err').forEach(x => x.remove());
  document.querySelectorAll('.bad').forEach(x => x.classList.remove('bad'));
  const check = (it) => {
    if (it.type === 'info' || it.type === 'company') return;
    const v = data[it.id];
    if (it.opt && (v === undefined || v === '' || (Array.isArray(v) && !v.length))) return;
    let bad = v === undefined || v === '' || (Array.isArray(v) && !v.length);
    let msg = it.type === 'sig' ? 'Please sign here.' : it.type === 'photo' ? 'Please add this photo.' : it.type === 'initials' ? 'Please add your initials.' : 'This is required.';
    if (!bad && it.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ bad = true; msg = 'Enter an email like name@example.com.'; }
    if (!bad && it.type === 'tel' && String(v).replace(/\D/g,'').length !== 10){ bad = true; msg = 'Enter a 10-digit phone number.'; }
    if (!bad && it.type === 'zip' && String(v).length !== 5){ bad = true; msg = 'Enter a 5-digit zip code.'; }
    if (bad){
      const w = document.querySelector(`[data-wrap="${it.id}"]`);
      if (w && !w.closest('.hidden')){ w.classList.add('bad'); w.insertAdjacentHTML('beforeend', `<div class="err">${msg}</div>`); missing.push(w); }
    }
  };
  const go = (items) => items.forEach(it => {
    if (it.row || it.row3) return go(it.row || it.row3);
    if (it.id) check(it);
    if (it.ifYes && data[it.id] === 'Yes') go(it.ifYes);
    if (it.ifNo && data[it.id] === 'No') go(it.ifNo);
    if (it.ifChecked && (data[it.id] || []).includes(it.ifChecked.option)) go(it.ifChecked.items);
    if (it.ifValue) it.ifValue.forEach(v => { if (data[it.id] === v.value) go(v.items); });
  });
  s.cards.forEach(c => { if (!c.showIf || c.showIf(data)) go(c.items); });
  // phone fields that are optional but filled must be valid
  if (missing.length){
    $('#alert').innerHTML = `<div class="alert">${missing.length === 1 ? 'One item needs' : missing.length + ' items need'} attention before you continue.</div>`;
    missing[0].scrollIntoView({behavior:'smooth', block:'center'});
    return false;
  }
  return true;
}

function answer(it){

    </div>`;
  STEPS.slice(0, -1).forEach((s, i) => {

      if (it.ifYes && data[it.id] === 'Yes') go(it.ifYes);
      if (it.ifNo && data[it.id] === 'No') go(it.ifNo);
      if (it.ifChecked && (data[it.id] || []).includes(it.ifChecked.option)) go(it.ifChecked.items);
    if (it.ifValue) it.ifValue.forEach(v => { if (data[it.id] === v.value) go(v.items); });
    });
    s.cards.forEach(c => { if (!c.showIf || c.showIf(data)) go(c.items); });
    h += `<section class="card sum"><button type="button" class="linkbtn edit" data-goto="${i}">Edit</button><h3>${esc(s.title)}</h3><dl>${rows || '<dd class="small">Nothing entered</dd>'}</dl></section>`;
  });

const ascii = s => String(s ?? '').replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...');
function buildPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const W = 612, H = 792, M = 44, CW = W - 2 * M;
  let y = 0, pg = 0;
  const header = () => {
    pg++;
    try{ doc.addImage(LOGO, 'PNG', (W - 130) / 2, 26, 130, 130 * 75 / 261); }catch(e){}
    doc.setDrawColor(7,114,188); doc.setLineWidth(1.2); doc.line(M, 68, W - M, 68);
    doc.setFontSize(8); doc.setTextColor(110); doc.setFont('helvetica','normal');
    doc.text('Kraushaar 35 Inc. DBA Lester Glenn Honda of Sea Girt - Application for Employment', M, H - 26);
    doc.text('Page ' + pg, W - M, H - 26, {align:'right'});
    doc.setTextColor(0); y = 88;
  };
  const need = h => { if (y + h > H - 46){ doc.addPage(); header(); } };
  const para = (t, size = 9.5, style = 'normal', color = 0) => {
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(color);
    for (const ln of doc.splitTextToSize(ascii(t), CW)){ need(size * 1.35); doc.text(ln, M, y + size); y += size * 1.35; }
    doc.setTextColor(0);
  };
  const band = t => { need(34); y += 6; doc.setFillColor(7,114,188); doc.rect(M, y, CW, 18, 'F'); doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(ascii(t).toUpperCase(), M + 7, y + 12.5); doc.setTextColor(0); y += 26; };
  const qa = (q, a) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(90);
    const ql = doc.splitTextToSize(ascii(q), CW); doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    const al = doc.splitTextToSize(ascii(a || '-'), CW);
    need(ql.length * 11 + Math.min(al.length, 3) * 13 + 6);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(90);
    ql.forEach(l => { doc.text(l, M, y + 8.5); y += 11; });
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(0);
    al.forEach(l => { need(13); doc.text(l, M, y + 10.5); y += 13; });
    y += 6;
  };
  const sigImg = (label, id, dateId) => {
    need(92);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(90); doc.text(ascii(label), M, y + 8.5); doc.setTextColor(0); y += 12;
    if (data[id]) try{ doc.addImage(data[id], 'PNG', M, y, 240, 60); }catch(e){}
    doc.setDrawColor(0); doc.setLineWidth(.7); doc.line(M, y + 62, M + 260, y + 62);
    doc.setFontSize(10); doc.text('Date: ' + fmtDate(data[dateId]), M + 290, y + 58);
    y += 76;
  };
  const photo = (label, id) => {
    const h = CW * 0.6 * 2.125 / 3.375;
    need(h + 26);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(90); doc.text(ascii(label), M, y + 8.5); doc.setTextColor(0); y += 13;
    if (data[id]){
      const p = doc.getImageProperties(data[id]);
      let w = CW * 0.6, hh = w * p.height / p.width; if (hh > h){ hh = h; w = hh * p.width / p.height; }
      doc.addImage(data[id], 'JPEG', M, y, w, hh); y += hh + 10;
    } else { doc.setFontSize(10); doc.text('No photo provided', M, y + 10); y += 20; }
  };

  header();

/* department -> its position drop-down (field id, label) */

const recipient = () => { const r = (isFord() ? FORD_EMAIL_ROUTES : EMAIL_ROUTES).find(x => x.positions.includes(jobPosition())); return String(r ? r.to : HR_EMAIL).split(/[;,\s]+/)[0].trim(); };   // always exactly one address
const jobPosition = () => DEPT_POS[data.position] ? (data[DEPT_POS[data.position][0]] || '') : '';
const emailSubject = () => {
  const name = `${(data.first || '').trim()} ${(data.last || '').trim()}`.trim();
  const pos = (jobPosition() || data.position || '').trim();   // the specific job position (department only if none chosen)
  const loc = (data.location || '').trim();                     // the store
  return ['Job Application ' + name, pos, loc].map(x => x.trim()).filter(Boolean).join(' - ');
};
const pdfName = () => `Application_${ascii(data.last || 'Applicant').replace(/\W+/g,'')}_${ascii(data.first || '').replace(/\W+/g,'')}_${today()}.pdf`;

/* Fields that are required even in test mode (Skip can't pass them, Email/Submit check them) */
function jobFieldsMissing(){
  const m = [];
  if (!data.position) m.push(['position', 'Desired Position Department']);
  const dp = DEPT_POS[data.position];
  if (dp && !data[dp[0]]) m.push(dp);
  if (!data.location) m.push(['location', 'Preferred Location']);
  return m;
}
const JOB_STEP = STEPS.findIndex(s => s.cards.some(c => c.items.some(it => it.id === 'position')));
function flagJobFields(){
  const m = jobFieldsMissing();
  m.forEach(([id]) => { const w = document.querySelector(`[data-wrap="${id}"]`);
    if (w && !w.classList.contains('bad')){ w.classList.add('bad'); w.insertAdjacentHTML('beforeend', '<div class="err">This is required.</div>'); } });
  if (m.length){
    $('#alert').innerHTML = `<div class="alert">${m.length === 1 ? 'One item needs' : m.length + ' items need'} attention before you continue.</div>`;
    document.querySelector(`[data-wrap="${m[0][0]}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
  }
  return m.length > 0;
}

    return true;
  }
  const missing = [];
  STEPS.slice(0, -1).forEach((s, i) => s.cards.forEach(c => { if (c.showIf && !c.showIf(data)) return;
    const go = items => items.forEach(it => { if (it.row || it.row3) return go(it.row || it.row3);
      if ((it.type === 'sig' || it.type === 'photo') && !it.opt && !data[it.id]) missing.push(`<button type="button" class="linkbtn" data-goto="${i}">${esc(it.label)}</button>`); });
    go(c.items); }));
  if (missing.length && !TEST_MODE){
    $('#sendarea').innerHTML = `<div class="alert" style="margin-top:12px">Please add these before ${verb}: ${missing.join(', ')}</div>`;
    return true;
  }
  return false;
}

        ${to ? `<div class="mgrbox"><span class="lbl">It's addressed to:</span><span class="addr">${esc(to).replace('@','@<wbr>')}</span></div>` : ''}

function buildEml(to, subject, body, fname, b64){
  const CRLF = '\r\n', B = 'LGBOUNDARY' + Date.now();
  const enc = t => '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(t))) + '?=';
  const wrap = str => str.replace(/(.{76})/g, '$1' + CRLF);
  const lines = [
    ...(to ? ['To: ' + to] : []),
    'Subject: ' + enc(subject),
    'X-Unsent: 1',
    'MIME-Version: 1.0',
    `Content-Type: multipart/mixed; boundary="${B}"`,
    '',
    '--' + B,
    'Content-Type: text/plain; charset="utf-8"',
    'Content-Transfer-Encoding: base64',
    '',
    wrap(btoa(unescape(encodeURIComponent(body)))),
    '',
    '--' + B,
    `Content-Type: application/pdf; name="${fname}"`,
    'Content-Transfer-Encoding: base64',
    `Content-Disposition: attachment; filename="${fname}"`,
    '',
    wrap(b64),
    '',
    '--' + B + '--',
    ''
  ];
  return new Blob([lines.join(CRLF)], {type:'message/rfc822'});
}

  $('#sendarea').innerHTML = '';

    const doc = buildPDF();
    const b64 = doc.output('datauristring').split(',')[1];
    const payload = {
      firstName: data.first || '', lastName: data.last || '', middleName: data.middle || '',
      email: data.email || '', cellPhone: data.phone_cell || '', homePhone: data.phone_home || '',
      position: data.position || '', salesPosition: data.position === 'Sales' ? (data.sales_position || '') : '',
      shopPosition: data.position === 'Shop' ? (data.shop_position || '') : '',
      partsPosition: data.position === 'Parts' ? (data.parts_position || '') : '',
      financePosition: data.position === 'Finance' ? (data.finance_position || '') : '',

      store: data.store || '', preferredLocation: data.location || '', sendTo: recipient(), applicationDate: fmtDate(data.app_date), subject: emailSubject(),
      submittedAt: new Date().toISOString(), fileName: pdfName(), pdfBase64: b64
    };
    const res = await fetch(FLOW_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    if (!res.ok) throw new Error('The server responded with status ' + res.status + '.');
    submitted = true; clearDraft();
    btn.textContent = 'Application submitted';
    $('#donebox').innerHTML = `<b>Thank you, ${esc(data.first || '')}. Your application was submitted.</b> Our hiring team will contact you${data.email ? ' at ' + esc(data.email) : ''}. You can keep a copy for your records below.`;
    const url = URL.createObjectURL(doc.output('blob'));
    $('#sendarea').innerHTML = `<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin:10px 0 0" href="${url}" download="${pdfName()}">Download my copy</a>`;
    $('#donebox').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){
    btn.disabled = false; btn.textContent = 'Try submitting again';
    $('#sendarea').innerHTML = `<div class="alert" style="margin-top:12px">Your application didn't go through. Check your internet connection and tap Try submitting again. If it still doesn't work, create a PDF and email it to us instead.</div>
      <button class="btn" type="button" id="makepdf" style="width:100%">Create my application PDF</button>`;
  }
}
